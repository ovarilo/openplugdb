name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and Bun versions come from mise.toml.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate dataset (schema, references, mappings, SVG, electrical consistency)
        run: bun run validate

      - name: Check committed exports match the sources
        run: bun run export:check

      - name: Check vendored EVicons files match the pinned @evicons/svg package
        run: bun run icons:check

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Type-check Astro project
        run: bun run check

      - name: Build static site
        run: bun run build

      - name: Check the build did not modify committed exports
        run: git diff --exit-code -- dist-data
