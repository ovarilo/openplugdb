<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" role="img" aria-labelledby="title desc">
  <title id="title">GB/T 20234.3 DC vehicle inlet (female), mating face</title>
  <desc id="desc">Schematic front view of the circular face. Top row: S−, CC2, S+ (small contacts), with CC1 below CC2. Middle row: DC− left, DC+ right (large contacts). Bottom row: A−, PE, A+. Rings are contact tubes (female contacts). Layout checked against the Phoenix Contact 1271833 inlet pin assignment. Not to scale.</desc>
  <g fill="none" stroke="#1c2430" stroke-width="3">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="73" cy="58" r="7"/>
    <circle cx="100" cy="58" r="7"/>
    <circle cx="127" cy="58" r="7"/>
    <circle cx="100" cy="84" r="7"/>
    <circle cx="57" cy="106" r="20"/>
    <circle cx="143" cy="106" r="20"/>
    <circle cx="70" cy="150" r="9"/>
    <circle cx="100" cy="150" r="12"/>
    <circle cx="130" cy="150" r="9"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1c2430" text-anchor="middle" dominant-baseline="central">
    <text x="57" y="106">DC−</text>
    <text x="143" y="106">DC+</text>
    <text x="100" y="150">PE</text>
    <text x="62" y="58" text-anchor="end">S−</text>
    <text x="100" y="42">CC2</text>
    <text x="138" y="58" text-anchor="start">S+</text>
    <text x="111" y="84" text-anchor="start">CC1</text>
    <text x="70" y="170">A−</text>
    <text x="130" y="170">A+</text>
  </g>
  <text x="100" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#5a6472" text-anchor="middle" letter-spacing="1">MATING FACE · FEMALE</text>
</svg>
