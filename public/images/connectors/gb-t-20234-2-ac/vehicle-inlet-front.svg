<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" role="img" aria-labelledby="title desc">
  <title id="title">GB/T 20234.2 AC vehicle inlet (female), mating face</title>
  <desc id="desc">Schematic front view of the contact insert, flat edge at the top (the latch recess above it is not drawn). Top row: CP left, CC right (small contacts). Middle row: N, PE, L1. Bottom row: L3, L2. Rings are contact tubes (female contacts). Layout checked against the Phoenix Contact 1271831 inlet pin assignment. Not to scale.</desc>
  <g fill="none" stroke="#1c2430" stroke-width="3">
    <path d="M52 36 H148 A80 80 0 1 1 52 36 Z"/>
    <circle cx="80" cy="60" r="6"/>
    <circle cx="120" cy="60" r="6"/>
    <circle cx="55" cy="98" r="12"/>
    <circle cx="100" cy="98" r="12"/>
    <circle cx="145" cy="98" r="12"/>
    <circle cx="77" cy="140" r="12"/>
    <circle cx="123" cy="140" r="12"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1c2430" text-anchor="middle" dominant-baseline="central">
    <text x="55" y="98">N</text>
    <text x="100" y="98">PE</text>
    <text x="145" y="98">L1</text>
    <text x="77" y="140">L3</text>
    <text x="123" y="140">L2</text>
    <text x="64" y="60" text-anchor="end">CP</text>
    <text x="136" y="60" text-anchor="start">CC</text>
  </g>
  <text x="100" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#5a6472" text-anchor="middle" letter-spacing="1">MATING FACE · FEMALE</text>
</svg>
