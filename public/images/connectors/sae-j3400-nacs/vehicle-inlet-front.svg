<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" role="img" aria-labelledby="title desc">
  <title id="title">SAE J3400 (NACS) vehicle inlet (male), mating face</title>
  <desc id="desc">Schematic front view, the two power contacts at the top. Top row: P1 (HV+, DC+ / L1) left, P2 (HV−, DC− / L2) right. Bottom row: CP left, PE (ground) in the middle, PP right (small pins). Filled circles are pins (male contacts). Contact positions follow the inlet interface figure of Tesla TS-0023666 section 5.1.1.2; not to scale.</desc>
  <g fill="none" stroke="#1c2430" stroke-width="3">
    <path d="M60 36 H140 Q172 36 172 70 V110 A72 72 0 0 1 28 110 V70 Q28 36 60 36 Z"/>
  </g>
  <g fill="#1c2430">
    <circle cx="68" cy="82" r="20"/>
    <circle cx="132" cy="82" r="20"/>
    <circle cx="72" cy="140" r="6"/>
    <circle cx="100" cy="142" r="11"/>
    <circle cx="128" cy="140" r="6"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <g fill="#ffffff">
      <text x="68" y="82">P1</text>
      <text x="132" y="82">P2</text>
      <text x="100" y="142">PE</text>
    </g>
    <g fill="#1c2430">
      <text x="62" y="140" text-anchor="end">CP</text>
      <text x="138" y="140" text-anchor="start">PP</text>
    </g>
  </g>
  <text x="100" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#5a6472" text-anchor="middle" letter-spacing="1">MATING FACE · MALE</text>
</svg>
